name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run advisory Claude review
        id: claude_review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANDREW_CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            Perform a read-only code review of PR #${{ github.event.pull_request.number }} for this ESP32 firmware repository.
            Report concrete P0-P2 correctness, build/configuration, hardware-target, flash-layout, security,
            release, and risky-test-coverage issues only. Set reviewed_head to exactly ${{ github.event.pull_request.head.sha }}.
            This review is advisory only. Do not gate merge, validation, or deployment on the review result.
            Do not modify files or push commits.
          claude_args: |
            --json-schema '{"type":"object","properties":{"reviewed_head":{"type":"string"},"review_result":{"type":"string","enum":["CLEAN","FINDINGS"]},"summary":{"type":"string"}},"required":["reviewed_head","review_result","summary"],"additionalProperties":false}'

      - name: Note unavailable advisory review
        if: ${{ steps.claude_review.outcome == 'failure' }}
        run: echo 'Claude review did not complete. This is advisory and does not block the pull request.' >> "$GITHUB_STEP_SUMMARY"
